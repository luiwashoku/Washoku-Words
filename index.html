<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>和食</title>
<meta name="theme-color" content="#0F463B">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

<header class="topbar">
    <div class="title-group">
        <h1>和食</h1>
        <p class="subtitle">Personal Washoku Study Companion</p>
    </div>

    
</header>

<main id="homeScreen">

<section class="hero">
    <h2>今日も少しずつ。</h2>
    <p>Learn Washoku one notebook page at a time.</p>
</section>

<section class="stats">
    <div class="stat">
        <span class="stat-number" id="answeredCount">0</span>
        <span class="stat-label">Answered</span>
    </div>

    <div class="stat">
        <span class="stat-number" id="correctCount">0</span>
        <span class="stat-label">Correct</span>
    </div>

    <div class="stat">
        <span class="stat-number" id="accuracy">0%</span>
        <span class="stat-label">Accuracy</span>
    </div>
</section>

<section class="categories">
    <h3>Categories</h3>
    <div id="categoryGrid">
        <!-- Generated by app.js -->
    </div>
</section>

</main>

<section id="pageScreen" class="hidden">

<div class="pageHeader">
    <button id="backHome">←</button>

    <div>
        <h2 id="pageTitle">基本のことば</h2>
        <p id="pageSubtitle">0 Lessons</p>
    </div>
</div>

<div id="lessonList">
</div>

</section>

<section id="quizScreen" class="hidden">

<div class="quizHeader">
    <button id="backToPages">←</button>
    <span id="questionProgress">1 / 20</span>
</div>

<div class="questionCard">

<div class="chapterTag" id="chapterTag">
味・香り・食感
</div>

<div id="questionText" class="question">
</div>

</div>

<div id="answerContainer" class="answers">
</div>

<div id="resultCard" class="hidden">

<h2 id="resultTitle">
Great!
</h2>

<div class="explanation">
<h4>日本語</h4>
<p id="jpExplanation"></p>
</div>

<div class="explanation">
<h4>English</h4>
<p id="enExplanation"></p>
</div>

<button id="nextQuestion">
Continue →
</button>

</div>

</section>

</div>

<script src="app.js"></script>

</body>
</html>
