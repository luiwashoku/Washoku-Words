<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>和食探究ノート</title>

  <meta
    name="theme-color"
    content="#3939FF"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <div id="app">

    <header class="topbar">
      <div class="title-group">
        <h1>和食探究ノート</h1>

        <p class="subtitle">
          1830+ washoku questions by lui
        </p>
      </div>
    </header>

    <main id="homeScreen">

      <section class="hero">
        <h2>今日も少しずつ。</h2>

        <p>
          Learn Washoku one notebook page at a time.
        </p>
      </section>

      <section class="stats">

        <div class="stat">
          <span
            class="stat-number"
            id="answeredCount"
          >
            0
          </span>

          <span class="stat-label">
            Answered
          </span>
        </div>

        <div class="stat">
          <span
            class="stat-number"
            id="correctCount"
          >
            0
          </span>

          <span class="stat-label">
            Correct
          </span>
        </div>

        <div class="stat">
          <span
            class="stat-number"
            id="accuracy"
          >
            0%
          </span>

          <span class="stat-label">
            Accuracy
          </span>
        </div>

      </section>

      <section class="categories">
        <h3>カテゴリー</h3>

        <div id="categoryGrid">
          <!-- Generated by app.js -->
        </div>
      </section>

    </main>

    <section
      id="pageScreen"
      class="hidden"
    >

      <div class="pageHeader">

        <button
          id="backHome"
          type="button"
          aria-label="Back to home"
        >
          ←
        </button>

        <div>
          <h2 id="pageTitle">
            基本のことば
          </h2>

          <p id="pageSubtitle">
            0 lessons
          </p>
        </div>

      </div>

      <div id="lessonList"></div>

    </section>

    <section
      id="quizScreen"
      class="hidden"
    >

      <div class="quizHeader">

        <div class="quizHeaderActions">
          <button
            id="backToPages"
            type="button"
            aria-label="Back to lessons"
          >
            ←
          </button>

          <button
            id="lessonIntroductionButton"
            class="hidden"
            type="button"
            aria-label="Read lesson introduction"
            aria-haspopup="dialog"
          >
            <svg
              viewBox="0 0 32 32"
              aria-hidden="true"
            >
              <circle cx="16" cy="16" r="11"></circle>
              <circle cx="12" cy="13" r="1.8"></circle>
              <circle cx="20" cy="13" r="1.8"></circle>
              <path d="M11 19c1.4 2 3 3 5 3s3.6-1 5-3"></path>
            </svg>
          </button>
        </div>

        <span id="questionProgress">
          1 / 20
        </span>

      </div>

      <dialog id="lessonIntroductionDialog">
        <div class="introductionHeader">
          <div>
            <span>はじめに</span>
            <h2 id="introductionTitle"></h2>
          </div>

          <button
            id="closeIntroduction"
            type="button"
            aria-label="Close introduction"
          ></button>
        </div>

        <div class="introductionBody">
          <section lang="ja">
            <h3>日本語</h3>
            <p id="introductionJapanese"></p>
          </section>

          <section lang="en">
            <h3>English</h3>
            <p id="introductionEnglish"></p>
          </section>
        </div>
      </dialog>

      <div class="questionCard">

        <div
          class="chapterTag"
          id="chapterTag"
        >
          味・香り・食感
        </div>

        <div
          id="questionText"
          class="question"
        ></div>

        <figure
          id="questionVisual"
          class="questionVisual hidden"
        >
          <img
            id="questionImage"
            alt=""
          />
        </figure>

      </div>

      <div
        id="answerContainer"
        class="answers"
      ></div>

      <div
        id="resultCard"
        class="hidden"
      >

        <h2 id="resultTitle">
          Great!
        </h2>

        <div
          id="grammarDetails"
          class="grammarDetails hidden"
        >
          <div class="grammarDetail">
            <h4>Grammar point</h4>
            <p id="grammarPoint"></p>
          </div>

          <div class="grammarDetail">
            <h4>Formation</h4>
            <p id="grammarFormation"></p>
          </div>

          <div class="grammarDetail">
            <h4>Casual form</h4>
            <p id="grammarCasual"></p>
          </div>
        </div>

        <div class="explanation">
          <h4>日本語</h4>
          <p id="jpExplanation"></p>
        </div>

        <div class="explanation">
          <h4>English</h4>
          <p id="enExplanation"></p>
        </div>

        <button
          id="nextQuestion"
          type="button"
        >
          Continue →
        </button>

      </div>

    </section>

  </div>

  <script src="app.js"></script>

</body>
</html>
