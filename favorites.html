    .vegetable { position: absolute; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); display: grid; width: clamp(42px, 10.5%, 150px); min-height: clamp(42px, 6vw, 74px); padding: 5px 7px; transform: translate(-50%, -50%); place-items: center; border: 0; border-radius: 12px; color: #111; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .vegetable:focus-visible { outline: 3px solid #3939ff; outline-offset: 2px; }
    .vegetable ruby { display: none; padding: clamp(5px, 0.55cqw, 9px) clamp(4px, 0.42cqw, 7px) clamp(3px, 0.24cqw, 4px); border: clamp(1px, 0.12cqw, 2px) solid #111; border-radius: clamp(4px, 0.42cqw, 7px); background: rgba(247, 244, 238, 0.94); box-shadow: clamp(1px, 0.12cqw, 2px) clamp(1px, 0.12cqw, 2px) 0 #111; font-size: clamp(8px, 1.15cqw, 19px); font-weight: 800; line-height: 1.15; white-space: nowrap; }
    .vegetable rt { font-size: 0.56em; font-weight: 700; }
    .vegetable.revealed ruby { display: ruby; }
    .page-navigation { z-index: 2; display: flex; flex: 0 0 auto; gap: 12px; margin-top: 8px; padding-bottom: env(safe-area-inset-bottom); }
    .page-arrow { display: grid; width: 50px; height: 50px; padding: 0; place-items: center; border: 2px solid #111; border-radius: 50%; color: #111; background: #f7f4ee; box-shadow: 3px 3px 0 #111; cursor: pointer; }
    .page-arrow svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .page-arrow:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #111; }
    .page-arrow:focus-visible { outline: 4px solid #f2bb05; outline-offset: 3px; }

    function speakJapanese(text) {
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) return;

      const utterance = new SpeechSynthesisUtterance(text);
      const knownFemaleNames = /kyoko|nanami|haruka|sayaka|ayumi|aoi|hina|ichika|mayu|mizuki|nozomi|shiori|female|女性/i;
      const knownMaleNames = /otoya|keita|daichi|naoki|male|男性/i;
      const japaneseVoices = window.speechSynthesis.getVoices()
        .filter((voice) => voice.lang.toLowerCase().startsWith("ja"))
        .sort((first, second) => {
          const score = (voice) => {
            const language = voice.lang.toLowerCase().replace("_", "-");
            return (knownFemaleNames.test(voice.name) ? 100 : 0)
              - (knownMaleNames.test(voice.name) ? 100 : 0)
              + (language === "ja-jp" ? 30 : 0)
              + (voice.localService ? 20 : 0)
              + (voice.default ? 5 : 0);
          };
          return score(second) - score(first);
        });
      utterance.voice = japaneseVoices[0] || null;
      utterance.lang = "ja-JP";
      utterance.rate = 0.78;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function renderRolloverPage() {
      const page = rolloverPages[currentPage];
      window.speechSynthesis?.cancel();
      test.replaceChildren();
      test.style.backgroundImage = `url("${page.image}")`;
      test.setAttribute("aria-label", page.label);

      page.items.forEach(([name, reading, x, y, spokenReading]) => {
        const button = document.createElement("button");
        button.className = "vegetable";
        button.type = "button";
        button.style.setProperty("--x", x);
        button.style.setProperty("--y", y);
        button.setAttribute("aria-label", `Reveal ${name}`);
        button.setAttribute("aria-pressed", "false");
        const ruby = document.createElement("ruby");
        ruby.append(name);
        const furigana = document.createElement("rt");
        furigana.textContent = reading;
        ruby.append(furigana);
        button.append(ruby);
        button.addEventListener("click", () => {
          const revealed = button.classList.toggle("revealed");
          button.setAttribute("aria-pressed", String(revealed));
          // Give each vocabulary item a distinct pause when one label contains several words.
          if (revealed) speakJapanese(spokenReading ?? reading.replace(/[・／/]/g, "。"));
        });
        test.append(button);
      });
    }

    function changeRolloverPage(direction) {
      currentPage = (currentPage + direction + rolloverPages.length) % rolloverPages.length;
      renderRolloverPage();
    }

    previousPage.addEventListener("click", () => changeRolloverPage(-1));
    nextPage.addEventListener("click", () => changeRolloverPage(1));
    renderRolloverPage();
