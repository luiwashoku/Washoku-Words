    const test = document.getElementById("vegetableTest");
    const previousPage = document.querySelector(".page-arrow.previous");
    const nextPage = document.querySelector(".page-arrow.next");
    let currentPage = 0;

    function speakJapanese(text) {
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) return;

      const utterance = new SpeechSynthesisUtterance(text);
      const knownFemaleNames = /kyoko|nanami|haruka|sayaka|ayumi|aoi|hina|ichika|mayu|mizuki|nozomi|shiori|female|女性/i;
      const knownMaleNames = /otoya|keita|daichi|naoki|male|男性/i;
      const japaneseVoices = window.speechSynthesis.getVoices()
        .filter((voice) => voice.lang.toLowerCase().startsWith("ja"))
        .sort((first, second) => {
          const score = (voice) => {
            const language = voice.lang.toLowerCase().replace("_", "-");
            return (knownFemaleNames.test(voice.name) ? 100 : 0)
              - (knownMaleNames.test(voice.name) ? 100 : 0)
              + (language === "ja-jp" ? 30 : 0)
              + (voice.localService ? 20 : 0)
              + (voice.default ? 5 : 0);
          };
          return score(second) - score(first);
        });
      utterance.voice = japaneseVoices[0] || null;
      utterance.lang = "ja-JP";
      utterance.rate = 0.78;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function renderRolloverPage() {
      const page = rolloverPages[currentPage];
      window.speechSynthesis?.cancel();
      test.replaceChildren();
      test.style.backgroundImage = `url("${page.image}")`;
      test.setAttribute("aria-label", page.label);

      const title = document.createElement("h1");
      title.className = "rollover-title";
      title.textContent = `${currentPage + 1}. ${page.title}`;
      test.append(title);

      page.items.forEach(([name, reading, x, y, spokenReading]) => {
        const button = document.createElement("button");
        button.className = "vegetable";
        button.type = "button";
        button.style.setProperty("--x", x);
        button.style.setProperty("--y", y);
        button.setAttribute("aria-label", `Reveal ${name}`);
        button.setAttribute("aria-pressed", "false");
        const bubble = document.createElement("span");
        bubble.className = "answer-bubble";
        const ruby = document.createElement("ruby");
        ruby.append(name);
        const furigana = document.createElement("rt");
        furigana.textContent = reading;
        ruby.append(furigana);
        bubble.append(ruby);
        button.append(bubble);
        button.addEventListener("click", () => {
          const revealed = button.classList.toggle("revealed");
          button.setAttribute("aria-pressed", String(revealed));
          // Give each vocabulary item a distinct pause when one label contains several words.
          if (revealed) speakJapanese(spokenReading ?? reading.replace(/[・／/]/g, "。"));
        });
        test.append(button);
      });
    }

    function changeRolloverPage(direction) {
      currentPage = (currentPage + direction + rolloverPages.length) % rolloverPages.length;
      renderRolloverPage();
    }

    previousPage.addEventListener("click", () => changeRolloverPage(-1));
    nextPage.addEventListener("click", () => changeRolloverPage(1));
    renderRolloverPage();
