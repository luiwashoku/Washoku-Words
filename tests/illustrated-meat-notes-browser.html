<!doctype html><meta charset="utf-8"><title>Animal vocabulary card checks</title>
<pre id="result">RUNNING</pre><iframe src="../index.html" style="width:390px;height:850px"></iframe>
<script>
(async () => {
  const frame = document.querySelector('iframe'), result = document.querySelector('#result');
  const assert = (value, message) => { if (!value) throw Error(message); };
  const until = async predicate => {
    for (let i = 0; i < 400; i++) {
      if (predicate()) return;
      await new Promise(resolve => setTimeout(resolve, 20));
    }
    throw Error('Timed out');
  };
  try {
    await until(() => frame.contentDocument.querySelector('#openVocabularyCards:not(:disabled)'));
    const d = frame.contentDocument, w = frame.contentWindow, played = [];
    class Audio extends w.EventTarget {
      constructor(src) { super(); this.src = src; }
      getAttribute(name) { return name === 'src' ? this.src : null; }
      play() { played.push(this.src); return Promise.resolve(); }
      pause() {}
    }
    w.Audio = Audio;
    [...d.querySelectorAll('.category-card')].find(b => b.textContent.includes('動物性食材')).click();
    await until(() => [...d.querySelectorAll('.lesson-card')].some(b => b.textContent.includes('肉カード')));
    let total = 0, withoutImage = 0;
    for (const [title, lesson, count] of [['鶏', 'chicken-parts-cards', 30], ['牛', 'beef-parts-cards', 44], ['豚', 'pork-parts-cards', 42], ['魚', 'fish-cards', 52]]) {
      const entries = (await fetch('../data/' + lesson + '.json').then(r => r.json())).entries;
      assert(entries.length === count, title + ' card count');
      const button = [...d.querySelectorAll('.lesson-card')].find(b => b.textContent.includes(title + 'カード'));
      assert(button, 'Deck ' + title); button.click();
      await until(() => d.querySelector('.vocabulary-card-counter')?.textContent === '1 / ' + count);
      for (let i = 0; i < count; i++) {
        const entry = entries[i], section = d.querySelector('.vocabulary-card-example');
        assert(d.querySelectorAll('.vocabulary-card-example').length === 1, 'One description');
        assert(section.querySelector('[lang="ja"]').textContent.length > 10, 'Japanese description');
        assert(section.querySelector('[lang="en"]').textContent.length > 20, 'English description');
        assert(d.querySelector('.vocabulary-card-reading').textContent === entry.japanese, 'Reading');
        assert(Boolean(d.querySelector('.vocabulary-card-illustration')) === Boolean(entry.image), 'Illustration is optional');
        assert(d.documentElement.scrollWidth <= w.innerWidth + 1, 'Mobile fit');
        const files = w.lessonAudioFiles[lesson], wordFile = files[w.getJapaneseSpeechText(entry.japanese)];
        assert(wordFile && played.at(-1) === wordFile, 'Automatic name audio: ' + entry.kanji);
        const descriptionFile = files[w.getJapaneseSpeechText(entry.example.japanese)];
        section.querySelector('button').click();
        assert(descriptionFile && played.at(-1) === descriptionFile, 'Description audio: ' + entry.kanji);
        total++; if (!entry.image) withoutImage++;
        if (i < count - 1) d.querySelector('#vocabularyCardNavigation button:last-child').click();
      }
      d.querySelector('#backFromExplosion').click();
      await until(() => d.querySelector('.lesson-card'));
    }
    assert(withoutImage === 65, 'All new cards work without images');
    result.textContent = 'PASS: ' + total + ' animal cards, including 65 without illustrations; automatic names, description buttons, bilingual text and mobile layout.';
  } catch (error) { result.textContent = 'FAIL: ' + error.stack; }
})();
</script>
