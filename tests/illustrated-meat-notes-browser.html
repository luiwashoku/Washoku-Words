<!doctype html><meta charset="utf-8"><title>Counting card checks</title><pre id="result">RUNNING</pre><iframe src="../index.html" style="width:390px;height:850px"></iframe>
<script>
(async()=>{const frame=document.querySelector('iframe'),result=document.querySelector('#result');const assert=(v,m)=>{if(!v)throw Error(m)};const until=async f=>{for(let i=0;i<400;i++){if(f())return;await new Promise(r=>setTimeout(r,20))}throw Error('Timed out')};try{await until(()=>frame.contentDocument.querySelector('#openVocabularyCards:not(:disabled)'));const d=frame.contentDocument,w=frame.contentWindow,played=[];class Audio extends w.EventTarget{constructor(src){super();this.src=src}getAttribute(n){return n==='src'?this.src:null}play(){played.push(this.src);return Promise.resolve()}pause(){}}w.Audio=Audio;[...d.querySelectorAll('.category-card')].find(b=>b.textContent.includes('動物性食材')).click();await until(()=>[...d.querySelectorAll('.lesson-card')].some(b=>b.textContent.includes('肉カード')));assert(d.querySelector('.lesson-card').textContent.includes('肉カード'),'First deck in category');for (const [title,count] of [['鶏',22],['牛',23],['豚',25]]) {
 const button=[...d.querySelectorAll('.lesson-card')].find(b=>b.textContent.includes(title+'カード'));assert(button,'Illustrated deck '+title);button.click();await until(()=>d.querySelector('.vocabulary-card-example'));
 for(let i=0;i<count;i++) {assert(d.querySelector('.vocabulary-card-example [lang="ja"]').textContent.length>10,'Japanese note');assert(d.querySelector('.vocabulary-card-example [lang="en"]').textContent.length>20,'English note');assert(d.querySelectorAll('.vocabulary-card-example').length===1,'Only the replacement description');assert(d.querySelector('.vocabulary-card-example button'),'Description audio button');assert(d.documentElement.scrollWidth<=w.innerWidth+1,'Mobile fit');if(i<count-1)d.querySelector('#vocabularyCardNavigation button:last-child').click();}
 d.querySelector('#backFromExplosion').click();await until(()=>d.querySelector('.lesson-card'));
}result.textContent='PASS: all 70 illustrated cards have bilingual culinary notes and fit mobile.';}catch(e){result.textContent='FAIL: '+e.stack}})();
</script>
