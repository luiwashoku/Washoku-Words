<!doctype html><meta charset="utf-8"><title>Koji notes checks</title>
<pre id="result">RUNNING</pre><iframe src="../index.html" style="width:360px;height:850px" title="App"></iframe>
<script>
(async()=>{
 const frame=document.querySelector('iframe'),result=document.querySelector('#result');
 const assert=(v,m)=>{if(!v)throw Error(m)};
 const until=async fn=>{for(let i=0;i<400;i++){if(fn())return;await new Promise(r=>setTimeout(r,25))}throw Error('Timed out')};
 try{
  await until(()=>frame.contentDocument.querySelector('#openVocabularyCards:not(:disabled)'));
  const d=frame.contentDocument,w=frame.contentWindow,q=s=>d.querySelector(s),plays=[];
  w.Audio=class extends w.EventTarget{
   constructor(src){super();this.src=src;this.paused=true;this.currentTime=0;this.playbackRate=1}
   getAttribute(name){return name==='src'?this.src:null}
   play(){this.paused=false;plays.push(this);return Promise.resolve()}
   pause(){this.paused=true}removeAttribute(name){if(name==='src')this.src=''}load(){}
  };
  const expected=message=>w.lessonAudioFiles['fermentation-notes-koji'][w.getJapaneseSpeechText(message.speech||message.japanese)];
  const data=await fetch('../data/fermentation-notes/koji.json').then(r=>r.json());
  const source=await fetch('../data/fermentation-notes/koji-source.txt').then(r=>r.text()),entry=data.entries[0];
  assert(entry.kanji+'\n'+entry.messages.map(m=>m.japanese).join('')===source,'Exact source preserved');
  q('[aria-label="Open 発酵ノート"]').click();
  const lesson=[...d.querySelectorAll('#lessonList button')].find(b=>b.textContent.includes('麹菌とは'));assert(lesson,'Second subdeck');lesson.click();
  await until(()=>q('.article-chunks'));
  const chunks=[...d.querySelectorAll('.article-chunk')];assert(chunks.length===25,'25 passages');
  const normalize=t=>t.replace(/[\s🟡⚫⚪🟤🔴︎]/gu,'');
  for(const [i,chunk] of chunks.entries()){
   const text=chunk.querySelector('.article-passage-text'),copy=text.cloneNode(true);copy.querySelectorAll('.furiganaReading').forEach(n=>n.remove());
   assert(normalize(copy.textContent)===normalize(entry.messages[i].japanese),'Verbatim passage '+i);
   const sound=chunk.querySelector('button:not(.article-english-toggle)');assert(!sound.disabled,'Audio ready '+i);
   const count=plays.length;sound.click();await until(()=>plays.length>count);
   assert(plays.at(-1).src===expected(entry.messages[i])&&plays.at(-1).playbackRate===1,'Matching recording '+i);
   const original=text.textContent,toggle=chunk.querySelector('.article-english-toggle');assert(toggle,'English toggle '+i);
   toggle.click();assert(text.lang==='en'&&text.textContent.includes(entry.messages[i].english.split('\n')[0].replace(/^• |^[🟡⚫⚪🟤🔴] /u,'')),'English '+i);
   toggle.click();assert(text.lang==='ja'&&text.textContent===original,'Japanese restored '+i);
  }
  const dots=[...d.querySelectorAll('.article-color-dot')];
  assert(dots.length===5,'Five custom color dots');
  for(const [i,color] of ['yellow','black','white','brown','red'].entries())assert(dots[i].classList.contains('article-color-dot--'+color),'Correct marker '+color);
  assert([...d.querySelectorAll('.article-flow')].every(n=>w.getComputedStyle(n).borderLeftStyle==='none'),'No flow side border');
  assert([...d.querySelectorAll('.article-species')].every(n=>w.getComputedStyle(n).backgroundColor==='rgba(0, 0, 0, 0)'),'No species backgrounds');
  const reading=q('.furiganaReading');assert(w.getComputedStyle(reading).display==='none','Furigana hidden');q('#vocabularyCardFurigana').click();assert(w.getComputedStyle(reading).display!=='none','Furigana available');
  assert(d.querySelectorAll('.article-passage-text h5').length>=14,'Heading hierarchy');
  const readAll=q('.story-play-all');assert(!readAll.disabled,'Read all enabled');
  readAll.click();const queue=plays.at(-1);
  for(const message of entry.messages){
   assert(queue.src===expected(message)&&queue.playbackRate===1,'Read all order');
   queue.dispatchEvent(new w.Event('ended'));
  }
  assert(queue.paused&&readAll.getAttribute('aria-pressed')==='false','Read all completes');
  readAll.click();const stopped=plays.at(-1);readAll.click();assert(stopped.paused,'Read all stops');
  readAll.click();const exitAudio=plays.at(-1);
  const figure=q('.article-diagram'),image=figure.querySelector('img');assert(figure.parentElement===chunks[15]&&image.src.endsWith('/assets/houshi.png'),'Diagram follows morphology');
  chunks[15].querySelector('.article-english-toggle').click();assert(image.isConnected&&image.src.endsWith('/assets/houshi.png'),'Diagram retained in English');
  assert(d.documentElement.scrollWidth<=w.innerWidth+1,'Phone layout');
  q('#backFromExplosion').click();assert(exitAudio.paused,'Exit stops Read all');assert(q('#pageTitle').textContent==='発酵ノート','Return to notes');
  result.textContent='PASS: verbatim source, 25 translated/furigana passages, typography, morphology diagram in both languages, 25 matching Marin 1x recordings, Read all and stop/exit cleanup, phone layout';
 }catch(e){result.textContent='FAIL: '+e.stack}
})();
</script>
