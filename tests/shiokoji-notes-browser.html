<!doctype html><meta charset="utf-8"><title>Shio koji notes checks</title>
<pre id="result">RUNNING</pre><iframe src="../index.html" style="width:360px;height:850px" title="App"></iframe>
<script>
(async()=>{
 const frame=document.querySelector('iframe'),result=document.querySelector('#result');
 const assert=(v,m)=>{if(!v)throw Error(m)};
 const until=async fn=>{for(let i=0;i<400;i++){if(fn())return;await new Promise(r=>setTimeout(r,25))}throw Error('Timed out')};
 try{
  await until(()=>frame.contentDocument.querySelector('#openVocabularyCards:not(:disabled)'));
  const d=frame.contentDocument,w=frame.contentWindow,q=s=>d.querySelector(s);
  const plays=[];
  w.Audio=class extends w.EventTarget{
   constructor(src){super();this.src=src;this.paused=true;this.currentTime=0;this.playbackRate=1}
   getAttribute(name){return name==='src'?this.src:null}
   play(){this.paused=false;plays.push(this);return Promise.resolve()}
   pause(){this.paused=true}removeAttribute(name){if(name==='src')this.src=''}load(){}
  };
  const expected=message=>w.lessonAudioFiles['fermentation-notes-shiokoji'][w.getJapaneseSpeechText(message.speech||message.japanese)];
  const data=await fetch('../data/fermentation-notes/shiokoji.json').then(r=>r.json()),entry=data.entries[0];
  const source=await fetch('../data/fermentation-notes/shiokoji-source.txt').then(r=>r.text());
  assert(entry.kanji+'\n'+entry.messages.map(m=>m.japanese).join('')===source,'Verbatim source');
  q('[aria-label="Open 発酵ノート"]').click();[...d.querySelectorAll('#lessonList button')].find(b=>b.textContent.includes('塩麹、変わり塩麹作り')).click();
  await until(()=>q('.article-chunks'));
  const chunks=[...d.querySelectorAll('.article-chunk')];assert(chunks.length===24,'24 passages');
  const normalize=t=>t.replace(/[\s•🔲□]/gu,'');
  for(const [i,chunk] of chunks.entries()){
   const text=chunk.querySelector('.article-passage-text'),copy=text.cloneNode(true);copy.querySelectorAll('.furiganaReading').forEach(n=>n.remove());
   assert(normalize(copy.textContent)===normalize(entry.messages[i].japanese),'All wording preserved '+i);
   const sound=chunk.querySelector('button:not(.article-english-toggle)');assert(!sound.disabled,'Audio ready '+i);
   const count=plays.length;sound.click();await until(()=>plays.length>count);
   assert(plays.at(-1).src===expected(entry.messages[i])&&plays.at(-1).playbackRate===1,'Correct recording '+i);
   const original=text.textContent,toggle=chunk.querySelector('.article-english-toggle');toggle.click();
   assert(text.lang==='en'&&text.textContent.includes(entry.messages[i].english.split('\n')[0].replace(/^• /,'')),'English '+i);
   toggle.click();assert(text.lang==='ja'&&text.textContent===original,'Japanese restored '+i);
  }
  assert(d.querySelectorAll('.article-microbe-list li').length>=20,'Solid benefit and ingredient lists');
  assert(d.querySelectorAll('.article-ingredient-amount').length===9,'All nine ingredient amounts bold');
  assert([...d.querySelectorAll('.article-ingredient-amount')].every(n=>n.previousSibling.textContent.endsWith(' ')&&!/[　\t]| {2,}/.test(n.previousSibling.textContent)),'Single-space ingredient amounts');
  assert([...d.querySelectorAll('.article-microbe-list')].every(n=>w.getComputedStyle(n).backgroundColor==='rgba(0, 0, 0, 0)'&&w.getComputedStyle(n).listStyleType==='disc'),'Plain solid lists');
  const reading=q('.furiganaReading');q('#vocabularyCardFurigana').click();assert(w.getComputedStyle(reading).display!=='none','Furigana available');
  const readAll=q('.story-play-all');assert(!readAll.disabled,'Read all ready');
  readAll.click();const queue=plays.at(-1);
  for(const message of entry.messages){assert(queue.src===expected(message),'Read all sequence');queue.dispatchEvent(new w.Event('ended'));}
  assert(queue.paused&&readAll.getAttribute('aria-pressed')==='false','Read all completes');
  readAll.click();const stopped=plays.at(-1);readAll.click();assert(stopped.paused,'Read all stops');
  assert(d.documentElement.scrollWidth<=w.innerWidth+1,'Phone layout');
  result.textContent='PASS: verbatim source, 24 translated/furigana passages, plain solid lists, recipe headings, 24 matching Marin 1x recordings, Read all and phone fit';
 }catch(e){result.textContent='FAIL: '+e.stack}
})();
</script>
