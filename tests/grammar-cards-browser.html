<!doctype html><meta charset="utf-8"><title>Grammar card checks</title>
<pre id="result">RUNNING</pre><iframe src="../index.html" style="width:320px;height:850px" title="App"></iframe>
<script>
(async () => {
 const frame=document.querySelector('iframe'), result=document.querySelector('#result');
 const assert=(v,m)=>{if(!v)throw Error(m)};
 const until=async fn=>{for(let i=0;i<300;i++){if(fn())return;await new Promise(r=>setTimeout(r,20))}throw Error('Timed out')};
 try {
  await until(()=>frame.contentDocument.querySelector('#openVocabularyCards:not(:disabled)'));
  const w=frame.contentWindow,d=frame.contentDocument,q=s=>d.querySelector(s),plays=[];
  class Audio extends w.EventTarget {
   constructor(src){super();this.src=src;this.paused=true;this.currentTime=0;this.playbackRate=1}
   getAttribute(name){return name==='src'?this.src:null}
   play(){this.paused=false;plays.push(this);return Promise.resolve()}
   pause(){this.paused=true}
  }
  w.Audio=Audio;
  const entries=await fetch('../data/grammar-cards.json').then(r=>r.json()).then(d=>d.entries);
  const original=w.Math.random;w.Math.random=()=>0.999999;
  assert(q('#openVocabularyCards').textContent==='単語カード','Word deck label');
  assert(q('#openVocabularyCards').nextElementSibling.id==='openGrammarCards','Grammar button sits to the right');
  assert(d.documentElement.scrollWidth<=w.innerWidth+1,'Home buttons fit phone width');
  q('#openGrammarCards').click();
  await until(()=>q('.vocabulary-study-card:not(.hidden)'));w.Math.random=original;
  const lookup=text=>w.lessonAudioFiles['grammar-cards'][w.getJapaneseSpeechText(text)];
  for(let i=0;i<entries.length;i++) {
   const entry=entries[i];
   assert(q('.vocabulary-card-counter').textContent===`${i+1} / ${entries.length}`,'Counter '+i);
   assert(plays.at(-1).src===lookup(entry.japanese),'Grammar point autoplays '+i);
   assert(plays.at(-1).playbackRate===1,'Native speed');
   assert(q('.vocabulary-card-meaning').textContent===entry.english,'Meaning '+i);
   assert(q('.grammar-card-formation p').textContent===entry.formation,'Formation '+i);
   assert(!q('.grammar-card-formation button'),'Formation is silent');
   const speakers=[...d.querySelectorAll('.grammar-card-example button')];
   assert(speakers.length===2,'Formal and casual speakers');
   for(let j=0;j<2;j++) {
    speakers[j].click();assert(plays.at(-1).src===lookup(entry.examples[j].japanese),'Example playback '+i+'/'+j);
    assert(plays.at(-1).paused===false,'Example plays');
   }
   assert(d.documentElement.scrollWidth<=w.innerWidth+1,'Phone width '+i);
   if(i<entries.length-1)q('#vocabularyCardNavigation button:last-child').click();
  }
  q('#vocabularyCardFurigana').click();
  assert(w.getComputedStyle(q('.grammar-card-example .furiganaReading')).display!=='none','Furigana shown');
  const last=plays.at(-1);q('#backFromExplosion').click();assert(last.paused,'Close stops audio');assert(!q('#homeScreen').classList.contains('hidden'),'Back returns home');
  result.textContent=`PASS: all ${entries.length} grammar cards, autoplay, ${entries.length*2} sentence speakers, silent formation, phone layout and cleanup.`;
 }catch(error){result.textContent='FAIL: '+error.stack}
})();
</script>
