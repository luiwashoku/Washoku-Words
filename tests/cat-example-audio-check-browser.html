<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><script src="../game-audio-manifest.js"></script><script>
(async()=>{try{const keys=["ごまをいれると、ふうみがよくなるよ。", "ごはんのかたさ、これくらいがすき。", "そのうち、いっしょにりょこうにいきたいね。"], context=new OfflineAudioContext(1,1,24000);const clips=await Promise.all(keys.map(async key=>{const path=window.gameAudioFiles[key];if(!path||!path.includes('/marin-'))throw Error('Wrong voice '+key);const r=await fetch('../'+path);if(!r.ok)throw Error('Missing '+key);const b=await context.decodeAudioData(await r.arrayBuffer());let peak=0,active=0;for(const x of b.getChannelData(0)){peak=Math.max(peak,Math.abs(x));if(Math.abs(x)>.01)active++}if(peak<.01||active/b.sampleRate<.05)throw Error('Silent '+key);return {key,duration:b.duration,peak}}));document.querySelector('#result').textContent=JSON.stringify({passed:true,clips});}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message}})();</script>
