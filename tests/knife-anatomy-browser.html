<!doctype html><meta charset="utf-8"><title>Counting card checks</title><pre id="result">RUNNING</pre><iframe src="../index.html" style="width:390px;height:850px"></iframe>
<script>
(async()=>{const frame=document.querySelector('iframe'),result=document.querySelector('#result');const assert=(v,m)=>{if(!v)throw Error(m)};const until=async f=>{for(let i=0;i<400;i++){if(f())return;await new Promise(r=>setTimeout(r,20))}throw Error('Timed out')};try{await until(()=>frame.contentDocument.querySelector('#openVocabularyCards:not(:disabled)'));const d=frame.contentDocument,w=frame.contentWindow,played=[];class Audio extends w.EventTarget{constructor(src){super();this.src=src}getAttribute(n){return n==='src'?this.src:null}play(){played.push(this.src);return Promise.resolve()}pause(){}}w.Audio=Audio;[...d.querySelectorAll('.category-card')].find(b=>b.textContent.includes('技術と料理')).click();await until(()=>[...d.querySelectorAll('.lesson-card')].some(b=>b.textContent.includes('包丁の形・構造・素材カード')));[...d.querySelectorAll('.lesson-card')].find(b=>b.textContent.includes('包丁の形・構造・素材カード')).click();await until(()=>d.querySelector('.knife-anatomy-diagram'));assert(d.querySelector('.knife-anatomy-diagram img').getAttribute('src')==='assets/knife_anatomy2.SVG','Correct SVG');assert(d.querySelectorAll('.knife-anatomy-label').length===30,'All diagram labels');assert(d.querySelectorAll('.reading-card-body > section').length===30,'Complete western and Japanese lists');assert(d.documentElement.scrollWidth<=w.innerWidth+1,'Mobile width');const label=d.querySelector('.knife-anatomy-label');label.focus();assert(d.activeElement===label,'Keyboard focus');label.click();assert(label.classList.contains('is-selected'),'Orange selection');assert(label.getAttribute('aria-pressed')==='true','Accessible selection');assert(played.at(-1)===w.lessonAudioFiles['knife-structure-cards']['ようぼうちょう'],'Diagram audio lookup');d.querySelector('#vocabularyCardNavigation button:last-child').click();assert(d.querySelector('#studyCardWord').textContent.startsWith('2.'),'Previous first page renumbered');result.textContent='PASS: knife anatomy image, vocabulary, focus, selection, playback and renumbering.';}catch(e){result.textContent='FAIL: '+e.stack}})();
</script>
