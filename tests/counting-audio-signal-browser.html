<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><script src="../lesson-audio-manifest.js"></script><script>
(async()=>{try{const path=window.lessonAudioFiles['counting-cards']['しち'];const response=await fetch('../'+path);if(!response.ok)throw Error('HTTP '+response.status);const context=new OfflineAudioContext(1,1,24000);const buffer=await context.decodeAudioData(await response.arrayBuffer());const samples=buffer.getChannelData(0);let peak=0,sum=0,active=0;for(const x of samples){peak=Math.max(peak,Math.abs(x));sum+=x*x;if(Math.abs(x)>0.01)active++}if(peak<0.01 || active/buffer.sampleRate<0.1)throw Error('Recording is effectively silent');document.querySelector('#result').textContent=JSON.stringify({path,duration:buffer.duration,peak,rms:Math.sqrt(sum/samples.length),activeSeconds:active/buffer.sampleRate});}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message}})();</script>
