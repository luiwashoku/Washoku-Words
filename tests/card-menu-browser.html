<!doctype html><meta charset="utf-8"><title>Card menu checks</title>
<pre id="result">RUNNING</pre><iframe src="../index.html" style="width:390px;height:850px" title="App"></iframe>
<script>
(async () => {
 const frame=document.querySelector('iframe'), result=document.querySelector('#result');
 const assert=(v,m)=>{if(!v)throw Error(m)};
 const until=async fn=>{for(let i=0;i<400;i++){if(fn())return;await new Promise(r=>setTimeout(r,20))}throw Error('Timed out')};
 try {
  await until(()=>frame.contentDocument.querySelector('#openVocabularyCards:not(:disabled)'));
  const w=frame.contentWindow,d=frame.contentDocument,q=s=>d.querySelector(s);
  class Audio extends w.EventTarget { constructor(src){super();this.src=src} getAttribute(n){return n==='src'?this.src:null} play(){return Promise.resolve()} pause(){} }
  w.Audio=Audio;
  for(const id of ['openVocabularyCards','openGrammarCards']) {
   q('#'+id).click(); await until(()=>q('.vocabulary-study-card:not(.hidden)'));
   const all=[...d.querySelectorAll('#vocabularyCardTools > button')].find(b=>b.textContent==='全');
   assert(all,'All menu exists for '+id); all.click();
   const dialog=q('#vocabularyCardTools dialog'), search=dialog.querySelector('input[type="search"]');
   assert(search,'Search exists'); const buttons=[...dialog.querySelectorAll('.popup-body button')];
   assert(buttons.length>1,'All cards listed');
   buttons.forEach((b,i)=>{
    assert(b.textContent.startsWith((i+1)+'. '),'Sequential menu numbers');
    const label=b.querySelector('strong');
    assert(label && label.textContent.slice(String(i+1).length+2).trim(),'Every Japanese label is present and bold');
   });
   const filter=value=>{search.value=value;search.dispatchEvent(new w.Event('input',{bubbles:true}))};
   filter('zzzz-no-matching-card');assert(buttons.every(b=>b.classList.contains('hidden')),'No-match filter');
   assert(!dialog.querySelector('.popup-body > p').hidden,'Empty result message');
   filter('');assert(buttons.every(b=>!b.classList.contains('hidden')),'Clear restores all entries');
   filter(buttons[1].textContent.split(' — ')[1]);assert(!buttons[1].classList.contains('hidden'),'English search preserves matching result');
   buttons[1].click();assert(!dialog.open,'Selecting result closes menu');
   assert(q('.vocabulary-card-counter').textContent.startsWith('2 /'),'Selection opens matching card');
   if(id==='openGrammarCards')assert(d.querySelectorAll('.grammar-card-example .vocabulary-card-translation').length===2,'Both examples have English translations');
   q('#backFromExplosion').click();
  }
  result.textContent='PASS: both numbered All menus, search and empty state, clearing, result navigation, and paired grammar translations.';
 } catch(error) { result.textContent='FAIL: '+error.stack; }
})();
</script>
