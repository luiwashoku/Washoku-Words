<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><script src="../lesson-audio-manifest.js"></script><script>
(async()=>{try{const context=new OfflineAudioContext(1,1,24000),manifest=window.lessonAudioFiles['counting-cards'];const checked=await Promise.all(Object.entries(manifest).map(async([key,path])=>{const response=await fetch('../'+path);if(!response.ok)throw Error(key+' HTTP '+response.status);const buffer=await context.decodeAudioData(await response.arrayBuffer());const samples=buffer.getChannelData(0);let peak=0,active=0;for(const x of samples){peak=Math.max(peak,Math.abs(x));if(Math.abs(x)>0.01)active++}return {key,peak,activeSeconds:active/buffer.sampleRate}}));const silent=checked.filter(x=>x.peak<0.01||x.activeSeconds<0.05);document.querySelector('#result').textContent=JSON.stringify({clips:checked.length,silent})}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message}})();</script>
