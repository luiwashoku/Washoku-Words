<script>
(async()=>{const frame=document.querySelector('iframe'),result=document.querySelector('#result');const assert=(v,m)=>{if(!v)throw Error(m)};const until=async f=>{for(let i=0;i<400;i++){if(f())return;await new Promise(r=>setTimeout(r,20))}throw Error('Timed out')};try{await until(()=>frame.contentDocument.querySelector('#openVocabularyCards:not(:disabled)'));const d=frame.contentDocument,w=frame.contentWindow;let plays=0;class Audio extends w.EventTarget{constructor(src){super();this.src=src}getAttribute(n){return n==='src'?this.src:null}play(){if(!this.src.startsWith('data:'))plays++;return Promise.resolve()}pause(){}}w.Audio=Audio;[...d.querySelectorAll('button')].find(b=>b.textContent.includes('日本語で話す')).click();await until(()=>[...d.querySelectorAll('.lesson-card')].some(b=>b.textContent.includes('活用カード')));[...d.querySelectorAll('.lesson-card')].find(b=>b.textContent.includes('活用カード')).click();await until(()=>d.querySelector('.conjugation-card-table'));assert(d.querySelectorAll('.conjugation-card-table').length===3,'Three reference sections');assert(d.querySelectorAll('.conjugation-card-detail').length===17,'Every form has formation/example');assert(d.querySelector('.conjugation-card-group').textContent.includes('Group 2'),'Correct verb group');assert(d.documentElement.scrollWidth<=w.innerWidth+1,'Fits phone width');assert(d.querySelectorAll('.vocabulary-study-card .explosion-example-speech').length===17,'Every sample has an audio button');assert(plays===0,'No recorded audio plays');assert(!d.querySelector('.vocabulary-cards-status').textContent,'No missing-audio warning');d.querySelector('.vocabulary-study-card .explosion-example-speech').click();assert(plays===1,'Sentence speaker plays recorded audio');for(let i=0;i<8;i++)d.querySelector('#vocabularyCardNavigation button:last-child').click();assert(d.querySelectorAll('.connection-reference-group').length===10,'Ten connection groups');assert(d.querySelectorAll('.connection-reference-pattern').length===87,'87 translated combinations');assert(d.documentElement.scrollWidth<=w.innerWidth+1,'Connection guide fits phone width');assert(plays===1,'Navigation and guide do not autoplay');assert(!d.querySelector('.vocabulary-study-card .explosion-example-speech'),'Connection fragments stay silent');result.textContent='PASS: conjugation preview and connection guide, translated patterns, phone width, recorded sentence playback and silent fragments.';}catch(e){result.textContent='FAIL: '+e.stack}})();
</script>
