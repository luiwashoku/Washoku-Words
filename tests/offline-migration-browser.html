<!doctype html><meta charset="utf-8"><title>Offline file migration checks</title>
<pre id="result">RUNNING</pre>
<script>
(async () => {
  const result = document.querySelector('#result');
  const assert = (value, message) => { if (!value) throw Error(message); };
  const scope = new URL('../', location.href).href;
  const realFetch = window.fetch.bind(window), stores = new Map(), listeners = {};
  let online = true;
  const absolute = path => new URL(typeof path === 'string' ? path : path.url, scope).href;
  const caches = {
    keys: async () => [...stores.keys()],
    delete: async name => stores.delete(name),
    open: async name => {
      if (!stores.has(name)) stores.set(name, new Map());
      const store = stores.get(name);
      return {
        put: async (key, response) => store.set(absolute(key), response.clone()),
        match: async (key, options = {}) => {
          const target = new URL(absolute(key));
          for (const [url, response] of store) {
            const candidate = new URL(url);
            if (candidate.href === target.href || (options.ignoreSearch && candidate.origin === target.origin && candidate.pathname === target.pathname)) return response.clone();
          }
        },
        addAll: async paths => {
          for (const path of paths) {
            const response = await realFetch(absolute(path));
            assert(response.ok, 'Shell download failed: ' + path);
            store.set(absolute(path), response.clone());
          }
        }
      };
    }
  };
  const self = {
    location: { origin: location.origin }, registration: { scope },
    clients: { claim: async () => {} }, skipWaiting: async () => {},
    addEventListener: (name, listener) => { listeners[name] = listener; }
  };
  const network = async request => {
    if (!online) throw Error('Airplane mode');
    return realFetch(absolute(request));
  };
  async function lifecycle(name) {
    let promise;
    listeners[name]({ waitUntil: task => { promise = task; } });
    await promise;
  }
  async function offlineFetch(path, headers) {
    const request = new Request(absolute(path), { headers });
    let promise;
    listeners.fetch({ request, respondWith: task => { promise = task; } });
    const response = await promise;
    return response.status === 302 ? offlineFetch(response.headers.get('Location')) : response;
  }
  try {
    const source = await realFetch(absolute('sw.js')).then(r => r.text());
    new Function('self', 'caches', 'fetch', 'URL', 'Request', 'Response', source)(self, caches, network, URL, Request, Response);
    await caches.open('washoku-shell-v343');
    const lesson = await caches.open('washoku-lesson-existing--123');
    await lesson.put('offline-saved/existing', new Response('{}'));
    const catalog = await realFetch(absolute('data/catalog.json')).then(r => r.json());
    const sources = new Set(catalog.filter(l => l.gameMode === 'vocabulary-cards' || l.answerMode === 'reading-card').flatMap(l => l.files || [l.file]));
    for (const path of sources) {
      const response = await realFetch(absolute(path));
      assert(response.ok, 'Dictionary source exists: ' + path);
      await lesson.put(path, response);
    }
    await lesson.put('favorites.html', new Response('<script src="japanese-speech.js"><' + '/script>'));
    await lesson.put('audio/test.mp3', new Response(new Uint8Array([10, 20, 30, 40, 50]), { headers: { 'Content-Type': 'audio/mpeg' } }));
    await lifecycle('install');
    await lifecycle('activate');
    assert(!(await caches.keys()).includes('washoku-shell-v343'), 'Old shell removed');
    assert((await caches.keys()).includes('washoku-lesson-existing--123'), 'Existing saved lesson retained');
    online = false;
    const moves = await realFetch(absolute('docs/file-moves.json')).then(r => r.json());
    let aliases = 0;
    for (const [old, current] of Object.entries(moves)) {
      if (!old.endsWith('.js') && old !== 'styles.css' && old !== 'word explosion.txt') continue;
      const legacy = await offlineFetch(old + '?previous-download=1');
      const canonical = await offlineFetch(current);
      assert(legacy.ok && canonical.ok && await legacy.text() === await canonical.text(), 'Legacy offline path: ' + old);
      aliases++;
    }
    assert((await offlineFetch('favorites.html')).ok, 'Previously saved dictionary page loads');
    const range = await offlineFetch('audio/test.mp3', { Range: 'bytes=1-3' });
    assert(range.status === 206 && range.headers.get('Content-Range') === 'bytes 1-3/5', 'Saved audio range response');
    assert([...new Uint8Array(await range.arrayBuffer())].join() === '20,30,40', 'Correct saved audio bytes');
    const host = {};
    for (const path of ['js/audio/japanese-speech.js', 'js/games/word-explosion.js', 'js/games/kanahachi.js']) {
      new Function('window', 'fetch', await offlineFetch(path).then(r => r.text()))(host, offlineFetch);
    }
    const dictionary = await host.Kanahachi.loadDictionary(catalog, new AbortController().signal);
    assert(dictionary.dictionary.size > 3000, 'Full Bee dictionary builds without a network');
    const boards = host.Kanahachi.generateBoards(dictionary.dictionary);
    assert(boards.length > 0 && boards.every(board => board.kana.length === 7 && board.answers.length >= 5), 'Playable seven-kana puzzles offline');
    result.textContent = `PASS: shell install/activation, ${aliases} legacy offline paths, saved-lesson preservation, cached audio ranges, ${dictionary.dictionary.size} Bee readings and ${boards.length} offline puzzles.`;
  } catch (error) { result.textContent = 'FAIL: ' + error.stack; }
})();
</script>
